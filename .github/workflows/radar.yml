name: Charts, Cards & Isometric Terrain

on:
  schedule:
    - cron: "30 3 * * *"     # daily at 03:30 UTC
  workflow_dispatch:          # manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate self-rated radar
        run: python scripts/radar.py --data assets/skills.json -o assets/radar

      - name: Generate language radar
        run: |
          python scripts/radar.py --github ${{ github.repository_owner }} \
            -o assets/radar-langs \
            --limit 7 --values --curve 0.4 \
            --exclude "shell,makefile,dockerfile,batchfile,procfile"
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate stat + project cards
        run: |
          python scripts/cards.py \
            --user ${{ github.repository_owner }} \
            --out assets \
            --projects assets/projects.json
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate 3D isometric calendar
        run: |
          python scripts/isometric_calendar.py \
            --user ${{ github.repository_owner }} \
            --out assets
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate achievements showcase
        run: |
          python scripts/achievements.py \
            --out assets

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "chore: refresh profile charts, cards, isometric terrain and achievements"
          git push
