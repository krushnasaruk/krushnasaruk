<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
    .title { font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 700; fill: #f0f6fc; }
    .subtitle { font-family: "Inter", sans-serif; font-size: 10px; fill: #8b949e; }
    .val { font-family: "JetBrains Mono", monospace; font-size: 15px; font-weight: 700; fill: #39D353; }
    .lbl { font-family: "Inter", sans-serif; font-size: 9.5px; font-weight: 500; fill: #8b949e; }
    .badge { font-family: "JetBrains Mono", monospace; font-size: 9px; font-weight: 600; fill: #39D353; }
    
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .pulse { animation: pulseDot 2s ease-in-out infinite; transform-origin: 20px 22px; }
    
    @keyframes borderGlow {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 0.9; }
    }
    .glow-border { animation: borderGlow 4s ease-in-out infinite; }
  </style>
  <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0b0f14"/>
    <stop offset="100%" stop-color="#111822"/>
  </linearGradient>
  <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#39D353" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#39D353" stop-opacity="0.1"/>
  </linearGradient>
</defs>
<rect x="1" y="1" width="478" height="158" rx="10" fill="url(#cardGrad)" stroke="#21262d" stroke-width="1"/>
<rect x="1" y="1" width="478" height="158" rx="10" fill="none" stroke="#39D353" stroke-width="1.2" stroke-dasharray="8 380" class="glow-border"/>
<rect x="12" y="1" width="80" height="2" rx="1" fill="url(#accentLine)"/>
<circle cx="20" cy="22" r="4" fill="#39D353" class="pulse"/>
<text x="32" y="26" class="title">~/ krushnasaruk <tspan font-weight="400" fill="#8b949e">stats</tspan></text>
<rect x="385" y="12" width="82" height="20" rx="10" fill="#39D35318" stroke="#39D353" stroke-opacity="0.3" stroke-width="0.8"/>
<text x="426" y="25.5" text-anchor="middle" class="badge">ACTIVE DEV</text>
<rect x="16" y="44" width="144" height="46" rx="6" fill="#111822" stroke="#212d3b" stroke-width="0.8"/>
<text x="26" y="64" font-size="11">📦</text>
<text x="42" y="64" class="val">37</text>
<text x="26" y="80" class="lbl">Repositories</text>
<rect x="168" y="44" width="144" height="46" rx="6" fill="#111822" stroke="#212d3b" stroke-width="0.8"/>
<text x="178" y="64" font-size="11">⭐</text>
<text x="194" y="64" class="val">5</text>
<text x="178" y="80" class="lbl">Total Stars</text>
<rect x="320" y="44" width="144" height="46" rx="6" fill="#111822" stroke="#212d3b" stroke-width="0.8"/>
<text x="330" y="64" font-size="11">🍴</text>
<text x="346" y="64" class="val">0</text>
<text x="330" y="80" class="lbl">Total Forks</text>
<rect x="16" y="98" width="144" height="46" rx="6" fill="#111822" stroke="#212d3b" stroke-width="0.8"/>
<text x="26" y="118" font-size="11">🔥</text>
<text x="42" y="118" class="val">1,860</text>
<text x="26" y="134" class="lbl">Contributions</text>
<rect x="168" y="98" width="144" height="46" rx="6" fill="#111822" stroke="#212d3b" stroke-width="0.8"/>
<text x="178" y="118" font-size="11">⚡</text>
<text x="194" y="118" class="val">12d</text>
<text x="178" y="134" class="lbl">Current Streak</text>
<rect x="320" y="98" width="144" height="46" rx="6" fill="#111822" stroke="#212d3b" stroke-width="0.8"/>
<text x="330" y="118" font-size="11">💻</text>
<text x="346" y="118" class="val">JavaScript</text>
<text x="330" y="134" class="lbl">Top Stack</text>
</svg>